# Daily probe of secrets.GH_PAT against the private fold monorepo. If the
# token is expired, revoked, or scope-reduced, this fires before the next
# PR, CI run, or deploy does — pings Discord so someone rotates it.
#
# Background: the org deps token has silently broken more than once — most
# recently 2026-05-18, when GH_PAT expired overnight and exemem deploys plus
# the dashboard cron failed unalerted for ~20h. This is the alerting half of
# the fix. It previously lived in EdgeVector/fold_db_node, which was archived
# (archived repos do not run scheduled workflows), so the probe went dark.
# Re-homed here in the org-wide .github repo.
name: GH_PAT Health Probe

on:
  schedule:
    - cron: '0 12 * * *'  # 12:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe private dep clone with GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # EdgeVector/fold is the private monorepo every Rust CI build and
          # both deploy pipelines clone. ls-remote hits the same auth path
          # cargo and actions/checkout would.
          for repo in EdgeVector/fold; do
            echo "Probing $repo..."
            if ! git ls-remote "https://x-access-token:${GH_PAT}@github.com/${repo}.git" HEAD >/dev/null 2>&1; then
              echo "::error::GH_PAT failed to authenticate against $repo"
              exit 1
            fi
            echo "  ok"
          done
          echo "GH_PAT is healthy."

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc \
            --arg title "GH_PAT auth failing" \
            --arg desc "Daily GH_PAT probe failed. Rotate the org-level GH_PAT secret now — until it is rotated, private-dep CI clones, both deploy pipelines, and the exemem dashboard cron fail org-wide with no other alert." \
            --arg url "$RUN_URL" \
            '{embeds:[{title:$title, description:$desc, url:$url, color:15158332}]}')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

name: CI

# Org-wide rulesets require every PR to have a passing `ci-required`
# status check before it can land. EdgeVector/.github has no real code
# to test (only reusable workflows), so this stub satisfies the rule
# without dragging in a Rust toolchain or anything else. If real tests
# ever live in this repo, replace the body with the actual checks —
# the umbrella job name (`ci-required`) is what the ruleset matches on.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    steps:
      - name: Stub
        run: echo "EdgeVector/.github has no testable code; ci-required passes by definition."

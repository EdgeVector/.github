name: Check changed paths (reusable)

# Reusable workflow that runs `dorny/paths-filter` once and emits canonical
# outputs the consuming repo's CI uses to gate expensive jobs. Skips a
# heavy clippy+test run on a one-line README change without disabling CI
# for actual code edits — and stays compatible with the org's branch-
# protection / merge-queue ruleset because the consuming repo's umbrella
# `ci-required` job still runs and treats `skipped` as success.
#
# Path categories the consumer can read off `outputs.*`:
#
#   rust       any *.rs, Cargo.toml, Cargo.lock, rust-toolchain.toml,
#              or any file under .github/workflows/ (a workflow edit
#              should always re-run Rust)
#   frontend   anything under src/server/static-react/, app/, or web/
#   cdk        anything under cdk/, infra/, or named *.ts at the repo root
#   docs_only  ONLY *.md, *.mdx, LICENSE*, *.txt, .gitignore, .editorconfig,
#              or files under docs/ — i.e. nothing else changed.
#              Heavy jobs typically gate on `!= 'true'` to skip on these.
#
# Every output is a string `"true"` / `"false"` (paths-filter convention),
# so consumers gate with `if: needs.changes.outputs.rust == 'true'`.
#
# Usage in a consuming repo (.github/workflows/ci.yml):
#
#     jobs:
#       changes:
#         uses: EdgeVector/.github/.github/workflows/check-paths.yml@main
#       rust:
#         needs: changes
#         if: needs.changes.outputs.rust == 'true'
#         ...
#       ci-required:
#         needs: [changes, rust]
#         if: always()
#         runs-on: ubuntu-latest
#         steps:
#           - run: |
#               for r in ${{ needs.rust.result }}; do
#                 case "$r" in
#                   success|skipped) ;;
#                   *) echo "::error::needed job $r"; exit 1 ;;
#                 esac
#               done
#
# Branch-protection contract: the consumer's required check is
# `ci-required`. That job ALWAYS runs (no path gate) and tolerates
# `skipped`, so branch protection sees a single deterministic result.
# Don't make any heavy job itself a required check — it'll deadlock on
# docs-only PRs.

on:
  workflow_call:
    outputs:
      rust:
        description: '"true" if any Rust source, Cargo manifest, or workflow file changed.'
        value: ${{ jobs.detect.outputs.rust }}
      frontend:
        description: '"true" if any file under typical frontend roots changed.'
        value: ${{ jobs.detect.outputs.frontend }}
      cdk:
        description: '"true" if any file under typical CDK / infra roots changed.'
        value: ${{ jobs.detect.outputs.cdk }}
      docs_only:
        description: '"true" if every changed file is documentation, license, or trivial config.'
        value: ${{ jobs.detect.outputs.docs_only }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cdk: ${{ steps.filter.outputs.cdk }}
      docs_only: ${{ steps.docs_only.outputs.value }}
    steps:
      # paths-filter walks the diff via the GitHub API on PRs and via
      # `git diff` on push events; checkout is required for the latter.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Use OR semantics: each filter is `true` if ANY of its patterns
          # match. Every category includes `.github/workflows/**` so a
          # workflow edit re-runs whichever gated job that workflow
          # controls — without that, an edit to `ci.yml` could skip the
          # very job being modified and merge with `ci-required: success`
          # from a skipped check. The `docs_only` check below uses set
          # arithmetic, not a path filter, so it isn't listed here.
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/rust-toolchain.toml'
              - '.github/workflows/**'
              - 'scripts/**'
            frontend:
              - 'src/server/static-react/**'
              - 'app/**'
              - 'web/**'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
              - '**/tsconfig*.json'
              - '.github/workflows/**'
            cdk:
              - 'cdk/**'
              - 'infra/**'
              - '*.ts'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - '**/*.mdx'
              - 'LICENSE*'
              - '**/*.txt'
              - '.gitignore'
              - '.editorconfig'
              - 'docs/**'
              - '.claude/**'
            non_docs:
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE*'
              - '!**/*.txt'
              - '!.gitignore'
              - '!.editorconfig'
              - '!docs/**'
              - '!.claude/**'

      # docs_only = "docs touched AND nothing else touched". Implemented
      # as `docs == 'true' && non_docs == 'false'` rather than a single
      # filter because paths-filter's negation operates per-pattern, not
      # per-set.
      - id: docs_only
        env:
          DOCS: ${{ steps.filter.outputs.docs }}
          NON_DOCS: ${{ steps.filter.outputs.non_docs }}
        run: |
          if [ "$DOCS" = "true" ] && [ "$NON_DOCS" = "false" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

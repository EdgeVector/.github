name: Manage org secret (manual)

# Manual workflow that creates or updates an EdgeVector org-level Actions
# secret using GH_PAT. Used because `gh secret set --org` requires admin
# scope that an interactive PAT typically lacks; this workflow runs from
# inside `EdgeVector/.github`, which can hold the admin-scoped GH_PAT as
# an org-level secret.
#
# Usage:
#   gh workflow run manage-org-secret.yml \
#     --repo EdgeVector/.github \
#     -f secret_name=SOME_NAME \
#     -f secret_value='...'
#
# `gh secret set` handles libsodium encryption internally — don't hand-
# roll it. Visibility is fixed to `all` (every org repo, including future
# ones); change here if a narrower scope is ever needed.
#
# Kept around for future rotations rather than deleted after first use.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Name of the org-level secret (e.g. DISCORD_WEBHOOK_URL)
        required: true
        type: string
      secret_value:
        description: Verbatim secret value — masked in logs
        required: true
        type: string

permissions: {}

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set org secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NAME: ${{ inputs.secret_name }}
          VALUE: ${{ inputs.secret_value }}
        run: |
          printf '%s' "$VALUE" | gh secret set "$NAME" --org EdgeVector --visibility all
          echo "::notice::Set org secret $NAME (visibility=all)"

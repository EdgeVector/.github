name: CI required

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse tracked Python sources
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z", "*.py"]).decode().split("\0")
          for name in filter(None, files):
              ast.parse(Path(name).read_text(), filename=name)
          PY
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Parse workflow and action YAML
        run: |
          git ls-files -z '*.yml' '*.yaml' | xargs -0 -r ruby -ryaml -e \
            'ARGV.each { |path| YAML.load_file(path, aliases: true) }'
